name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # eve resolves @romanbsd/mnemon-core through its dist/ types.
      - run: npm run build
      - run: npm run lint
      - run: npm run check-types
      - run: npm test

  publish:
    needs: test
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Check tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for pkg in core eve openai; do
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "packages/$pkg is $version but the tag is $GITHUB_REF_NAME" >&2
              exit 1
            fi
          done
      # prepack builds dist/; core, then eve, then openai.
      # Skip packages already on the registry so a partial release can be retried.
      - name: Publish packages
        run: |
          set -euo pipefail
          publish_one() {
            local dir="$1"
            local name version
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published — skipping"
              return 0
            fi
            npm publish -w "$name" --access public
          }
          publish_one core
          publish_one eve
          publish_one openai

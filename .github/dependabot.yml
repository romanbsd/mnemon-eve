version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The root lockfile covers both workspaces.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # eve 0.x minors are breaking; @romanbsd/mnemon-eve pins its peer range
      # to one minor, so move to a new eve minor by hand with the peer range.
      - dependency-name: eve
        update-types: ["version-update:semver-minor"]
